name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPSAGENT_LLM: "off"  # CI never calls the LLM: tests and offline eval are deterministic and free
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Unit tests
        run: uv run pytest -q
      - name: Scenario eval (offline)
        run: uv run opsagent eval
